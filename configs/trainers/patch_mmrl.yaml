name: "MMRL (Patch)"
description: "Multi-Modal Representation Learning for HSI Classification"
type: "prompt_learning"

# Prompt settings (same shape as CoOp/Maple configs)
prompt:
  class_token_position: "end"    # "front" | "middle" | "end"
  ctx_init: "hyperspectral image of a"                 # e.g., "a hyperspectral image of a"
  ctx_len: 4
  csc: False                     # Class-Specific Context

# MMRL-specific hyperparameters for representation tokens
patch_mmrl:
  n_rep_tokens: 5              # Number of learnable representation tokens
  rep_dim: 512                 # Dimension of representation token embeddings
  n_layers: 6                 # Number of transformer layers for token injection
  alpha: 0.7                   # Logit fusion weight (0.7 = 70% main, 30% token-enhanced)
  reg_weight: 0.2              # Cosine similarity regularization weight



# Training
training:
  epochs: 50
  batch_size_train: 32
  train_split_ratio: 0.8
  num_workers: 8
  learning_rate: 2.0e-3
  weight_decay: 1.0e-4


# Loss weights
loss_weights:
  cls: 1.0                     # Classification loss weight
  reg: 0.2                     # Regularization loss weight
