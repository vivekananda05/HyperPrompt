name: "PromptSRC + HyperPrompt"
description: "PromptSRC with the HyperPrompt dual-branch framework"
type: "prompt_learning"

prompt:
  class_token_position: "end"
  ctx_init: "hyperspectral image of a"
  ctx_len_patch: 4
  ctx_len_pixel: 8
  csc: false

self_reinforcing:
  temperature: 1.0

tcdm:
  last_k_layers: 4
  use_cls_only: false

training:
  epochs: 50
  batch_size_train: 32
  train_split_ratio: 0.8
  num_workers: 8
  learning_rate: 2.0e-3
  weight_decay: 1.0e-4

loss_weights:
  cls: 1.0
  mse: 0.1
  src_text: 1.0
  src_image: 1.0
  src_logit: 1.0
