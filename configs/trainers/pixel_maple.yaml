name: "MaPLe (Pixel)"
description: "Single SAM - Modular Prompt Learning for Vision-Language Models (Pixel Branch)"
type: "single_prompt_learning"

# MaPLe-specific settings with pixel reconstruction
# Extends MaPLe with pixel-level reconstruction from SAM backbone
prompt:
  class_token_position: "end"    # "front" | "middle" | "end"
  ctx_init: "hyperspectral image of a"
  ctx_len: 8                     # Context tokens per layer for pixel branch
  csc: False                     # Class-Specific Context
  prompt_depth: 3                # Number of transformer layers with prompts (1-12)

# Training
training:
  epochs: 50
  batch_size_train: 32
  train_split_ratio: 0.8
  num_workers: 8
  learning_rate: 2.0e-3
  weight_decay: 1.0e-4

# Loss weights
loss_weights:
  mse: 0.1                       # Reconstruction loss (pixel branch specific)
  cls: 1.0                       # Classification loss
